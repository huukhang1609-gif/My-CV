<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
           width: 50px;
           height: 50px;
           position: relative;
           background-color: red; 
           animation-duration: 4s;
           animation-name: myAnimation;
        }
        @keyframes  myAnimation{
           0% {background-color: red;top:0px;left:0px}
           25% {background-color: yellow;top:0px;left:200px}
           50% {background-color: green;top:200px;left:200px}
           75% {background-color: blue;top:200px;left:0px}
           100% {background-color: red;top:0px;left:0px}
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
