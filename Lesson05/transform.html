<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
          width: 100px;
          height: 50px;
          background-color: yellow;
          transform: translateX(100%);
        }
        .b{
          width: 100px;
          height: 50px;
          margin: 200px;
          background-color: yellow;
          transform: Scale(1.5);
        }
        .c{
          width: 100px;
          height: 50px;
          margin: 200px;
          background-color: yellow;
          transform: Rotate(20deg);
        }
        .d{
          width: 100px;
          height: 50px;
          margin: 200px;
          background-color: yellow;
          transform: skew(20deg);
        }
    </style>
</head>
<body>
    <h1>Transform CSS</h1>
    <h2>1. Transform(100%)</h2>
    <div class="a">TranslateX(100%)</div>
    <h2>2. Scale(1.5)</h2>
    <div class="b">Scale(1.5)</div>
    <h2>3. RotateX(20deg)</h2>
    <div class="c">Xoay</div>
    <h2>4. Scale(20deg)</h2>
    <div class="d">Nghiêng</div>
</body>
</html>
